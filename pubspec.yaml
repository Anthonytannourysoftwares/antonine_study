name: antonine_study
description: "Antonine Study — AI-powered study assistant for Antonine University students"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Local DB (Hive — lightweight, offline-first)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5

  # Secure storage
  flutter_secure_storage: ^9.2.4

  # Camera & image
  camera: ^0.11.1
  image_picker: ^1.1.2

  # ML Kit
  google_mlkit_text_recognition: ^0.15.1

  # Charts
  fl_chart: ^0.70.2

  # Animations
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0

  # Fonts & Icons
  google_fonts: ^6.2.1
  phosphor_flutter: ^2.1.0

  # HTTP client
  http: ^1.2.2

  # Utils
  intl: any
  crypto: ^3.0.6
  uuid: ^4.5.1
  shared_preferences: ^2.3.5
  json_annotation: ^4.9.0
  open_filex: ^4.7.0
  file_picker: ^11.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3
  json_serializable: ^6.9.4
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.5

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/ua_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/ua_logo.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/images/ua_logo.png"
  android: true
  ios: true
  android_12:
    color: "#FFFFFF"
    image: "assets/images/ua_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/models/
    - assets/images/
    - assets/lottie/
